# Organizacija i repo: https://<ORG>.github.io/valor/
# Ako se ime organizacije ili repoa promijeni, promijeniti url i baseurl.
title: VALOR
url: "https://inside-lab-fer.github.io"
baseurl: "/valor"
markdown: kramdown
timezone: Europe/Zagreb
exclude: [README.md, Gemfile, Gemfile.lock]

defaults:
  - scope: { path: "" }
    values: { layout: default, lang: hr }
  - scope: { path: "en" }
    values: { lang: en }
  - scope: { path: "hr", type: posts }
    values: { layout: post, lang: hr, permalink: "/vijesti/:year/:month/:title/" }
  - scope: { path: "en", type: posts }
    values: { layout: post, lang: en, permalink: "/en/news/:year/:month/:title/" }
