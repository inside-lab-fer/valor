---
layout: default
---
{%- assign t = site.data.i18n[page.lang] -%}
<main class="wrap narrow">
  <article class="post">
    <p class="meta"><a href="{{ t.news_url | relative_url }}">{{ t.news }}</a> · <time datetime="{{ page.date | date_to_xmlschema }}">{% include date.html date=page.date lang=page.lang %}</time></p>
    <h1>{{ page.title }}</h1>
    {%- if page.image %}
    <figure class="lead"><img src="{{ page.image | relative_url }}" alt="{{ page.image_alt }}">{% if page.image_caption %}<figcaption>{{ page.image_caption }}</figcaption>{% endif %}</figure>
    {%- endif %}
    <div class="prose">{{ content }}</div>
    <p class="back"><a href="{{ t.news_url | relative_url }}">← {{ t.back }}</a></p>
  </article>
</main>
